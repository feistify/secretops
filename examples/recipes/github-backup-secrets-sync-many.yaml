action: github.env_secret.sync_many
env: staging
github_owner: example-owner
github_repo: example-repo
github_environment: staging

secrets:
  - source: BACKUP_AWS_ACCESS_KEY_ID
    target: BACKUP_AWS_ACCESS_KEY_ID
  - source: BACKUP_AWS_SECRET_ACCESS_KEY
    target: BACKUP_AWS_SECRET_ACCESS_KEY
  - source: BACKUP_S3_BUCKET
    target: BACKUP_S3_BUCKET
  - source: BACKUP_AWS_REGION
    target: BACKUP_AWS_REGION
