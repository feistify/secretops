name: Installer in containers

# Runs tests/test_install_container.sh (the installer in throwaway containers,
# with a fake vault CLI) on release tags and weekly. It needs Docker and
# network access and is too slow for every pull request.

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12', 'ubuntu:22.04']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the wheel
        run: uv build

      - name: Run the installer in a container
        env:
          IMAGE: ${{ matrix.image }}
        run: sh tests/test_install_container.sh
