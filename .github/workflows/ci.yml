name: CI

# Changes only to Markdown or license files do not run the tests: no test
# reads them. If CI ever becomes a required check, docs-only pull requests
# would then wait forever; handle that before requiring it.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Run broker wrapper tests
        run: sh tests/test_broker_wrappers.sh
