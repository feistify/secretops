name: CI

# Changes only to Markdown or license files do not run the tests: no test
# reads them. If CI ever becomes a required check, docs-only pull requests
# would then wait forever; handle that before requiring it.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Run broker wrapper tests
        run: sh tests/test_broker_wrappers.sh
