name: CI

# Changes only to Markdown or license files do not run the tests: no test
# reads them. If CI ever becomes a required check, docs-only pull requests
# would then wait forever; handle that before requiring it.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Run broker wrapper tests
        run: sh tests/test_broker_wrappers.sh
