name: CI

# Changes only to Markdown or license files do not run the tests: no test
# reads them. If CI ever becomes a required check, docs-only pull requests
# would then wait forever; handle that before requiring it.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Run broker wrapper tests
        run: sh tests/test_broker_wrappers.sh
